<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title description">
  <title id="title">Example A/B driving inputs from the repository</title>
  <desc id="description">Three example input metrics from the repository's inference code. Run A and Run B respectively: average speed 5.82 and 5.01 metres per second, maximum acceleration 3.05 and 4.20 metres per second squared, and hard-braking sample counts zero and two. These are example inputs, not model predictions or performance results. The model is Qwen2.5-VL-3B with LoRA.</desc>
  <rect width="640" height="300" fill="#fcfbf8"/>
  <g fill="#292923">
    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="32" y="37" font-size="22">Example inputs from the repository</text>
      <g font-size="23">
        <text x="480" y="82" text-anchor="end">A</text>
        <text x="608" y="82" text-anchor="end">B</text>
      </g>
      <path d="M32 96H608" stroke="#292923" stroke-width="1.4"/>
      <g font-size="22">
        <text x="32" y="132">Average speed <tspan fill="#716c62">(m/s)</tspan></text>
        <text x="32" y="175">Max. acceleration <tspan fill="#716c62">(m/s²)</tspan></text>
        <text x="32" y="218">Hard-braking samples</text>
      </g>
      <path d="M32 237H608" stroke="#292923" stroke-width="1.4"/>
      <text x="32" y="276" font-size="23">Qwen2.5-VL-3B <tspan fill="#716c62">· LoRA</tspan></text>
    </g>
    <g font-family="'Courier New', monospace" font-size="25" text-anchor="end">
      <text x="480" y="132">5.82</text><text x="608" y="132">5.01</text>
      <text x="480" y="175">3.05</text><text x="608" y="175">4.20</text>
      <text x="480" y="218">0</text><text x="608" y="218">2</text>
    </g>
  </g>
</svg>
