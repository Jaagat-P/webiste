<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
  <title id="title">Monco: a molecular discovery workflow</title>
  <desc id="desc">A conceptual diagram: identify targets using gene networks and cryptic pockets, generate candidate molecules with a variational autoencoder and reinforcement learning, and evaluate candidates through docking and molecular similarity.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#bdcbbb" opacity=".45"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#a76447" stroke-width="1.3"/></marker>
    <linearGradient id="field" x1="0" x2="1" y2="1"><stop stop-color="#e6ede2"/><stop offset="1" stop-color="#f3f2e9"/></linearGradient>
  </defs>
  <rect width="600" height="560" rx="10" fill="url(#field)"/>
  <rect width="600" height="560" rx="10" fill="url(#grid)"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#657761">
    <text x="32" y="31">MONCO</text><text x="568" y="31" text-anchor="end">MOLECULAR DISCOVERY</text>
  </g>
  <g fill="#fcfcf6" stroke="#c8d2c2"><rect x="28" y="53" width="544" height="138" rx="12"/><rect x="28" y="215" width="544" height="138" rx="12"/><rect x="28" y="377" width="544" height="138" rx="12"/></g>
  <g stroke="#a76447" stroke-width="1.6" fill="none" marker-end="url(#arrow)"><path d="M300 192v16"/><path d="M300 354v16"/></g>
  <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.4" fill="#a15e43">
    <text x="52" y="82">01 / DISCOVER</text><text x="52" y="244">02 / DESIGN</text><text x="52" y="406">03 / EVALUATE</text>
  </g>
  <g font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#2e4437">
    <text x="52" y="120">Identify targets</text><text x="52" y="282">Generate candidates</text><text x="52" y="444">Assess interactions</text>
  </g>
  <g font-family="'DM Sans', sans-serif" font-size="14" fill="#66745f">
    <text x="52" y="150">Gene networks + cryptic pockets</text><text x="52" y="312">VAE + reinforcement learning</text><text x="52" y="474">Docking + molecular similarity</text>
  </g>
  <!-- Abstract gene network; emphasized nodes mark potential targets. -->
  <g stroke="#98ac93" stroke-width="2" fill="none">
    <path d="m397 95 32-18 37 21 41-11 28 36-28 40-42-8-36 20-39-38 7-42m0 0 68 60m-36-78v98m-39-38 76-39 41 65m-78-30 106-10m-70 32 42-68"/>
  </g>
  <g fill="#55725b" stroke="#fcfcf6" stroke-width="3"><circle cx="397" cy="95" r="7"/><circle cx="429" cy="77" r="8"/><circle cx="466" cy="98" r="8"/><circle cx="507" cy="87" r="7"/><circle cx="535" cy="123" r="8"/><circle cx="507" cy="163" r="7"/><circle cx="465" cy="155" r="8"/><circle cx="429" cy="175" r="6"/><circle cx="390" cy="137" r="7"/></g>
  <circle cx="429" cy="133" r="19" fill="#c17b53" fill-opacity=".15"/><circle cx="429" cy="133" r="9" fill="#b7724d" stroke="#fcfcf6" stroke-width="3"/>
  <!-- Schematic candidates, not a specific chemical structure. -->
  <g fill="none" stroke="#55725b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m397 268 23-13 23 13v27l-23 13-23-13zm46 0 23-13 23 13v27l-23 13-23-13m-46-27-18-11m64 38 14 20m9-60 1-18m22 31 20-8m-104 8 15-8m-17 30v-17m39-3-15-8m-5 40 15-8"/>
    <path d="m503 317 13-8 14 8v16l-14 8-13-8z" stroke="#b7724d"/><path d="m508 251 13-8 14 8" stroke="#b7724d"/>
  </g>
  <g fill="#b7724d" font-family="'DM Sans', sans-serif" font-size="15"><text x="455" y="235">N</text><text x="513" y="265">O</text><text x="368" y="258">N</text></g>
  <!-- A docking pocket and candidate, drawn as a conceptual illustration. -->
  <path d="M404 412c-23 7-28 29-22 48 7 23 33 38 57 35 22-2 41-1 61 4 16 4 38-5 39-25 1-16-9-27-24-33-14-6-22 4-23 18-1 12-20 12-29 7-16-9-9-18-9-30 1-18-27-31-50-24Z" fill="#dfe8d8" stroke="#95ac8e" stroke-width="1.5"/>
  <path d="M408 423c-13 7-17 17-12 29 5 11 20 23 34 24m75 10c10 1 20-6 20-14" fill="none" stroke="#bacbb3" stroke-width="2"/>
  <g fill="none" stroke="#b7724d" stroke-width="3" stroke-linejoin="round"><path d="m456 415 17-10 18 10v21l-18 10-17-10zm35 0 15-9m-50 30-14 9"/></g>
  <g stroke="#a76447" stroke-width="1.4" stroke-dasharray="3 4"><path d="m473 448 1 14m-32-18-12-3m76-35 8 13"/></g>
  <text x="300" y="542" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.5" fill="#7c8972">CONCEPTUAL WORKFLOW</text>
</svg>
