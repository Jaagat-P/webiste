<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title description">
  <title id="title">Naive Bayes scoring rule</title>
  <desc id="description">The scoring rule in the project code: prior times positive-class likelihood divided by the sum of the two prior-weighted class likelihoods. The features are character entropy, concerning-term count, and absolutist-term count. This is a method equation, not a measured or validated prediction.</desc>
  <rect width="640" height="300" fill="#fcfbf8"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#292923">
    <text x="32" y="39" font-size="24">Naive Bayes scoring</text>
    <text x="44" y="142" font-size="36" font-style="italic">s(x) =</text>
    <text x="390" y="113" text-anchor="middle" font-size="36" font-style="italic">π L₁(x)</text>
    <path d="M180 128H600" stroke="#292923" stroke-width="1.4"/>
    <text x="390" y="168" text-anchor="middle" font-size="31" font-style="italic">π L₁(x) + (1 − π)L₀(x)</text>
    <text x="320" y="206" text-anchor="middle" font-size="19" fill="#716c62">π: prior · L: class-conditional feature likelihood</text>
    <path d="M32 226H608" stroke="#292923" stroke-opacity=".25"/>
    <text x="32" y="254" font-size="21">Character entropy · concerning-term count</text>
    <text x="32" y="280" font-size="21">Absolutist-term count</text>
  </g>
</svg>
