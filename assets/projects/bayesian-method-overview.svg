<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title description">
  <title id="title">Bayesian risk assessment method overview</title>
  <desc id="description">A conceptual overview of the public project's method: tweet text is converted into character entropy and counts of concerning and absolutist terms, which inform a Bayesian score. This diagram presents the method, not measured performance or validated dangerousness predictions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#7a8071" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#34362f">
    <text x="32" y="43" font-size="14" letter-spacing="1.4" fill="#68735f">METHOD OVERVIEW</text>
    <path d="M32 64H608" stroke="#d8d6cb"/>
    <rect x="32" y="105" width="152" height="116" rx="3" fill="#efeee6" stroke="#d8d6cb"/>
    <rect x="228" y="105" width="184" height="116" rx="3" fill="#e9ede3" stroke="#cbd2c2"/>
    <rect x="456" y="105" width="152" height="116" rx="3" fill="#f0e7de" stroke="#d9c8b9"/>
    <g stroke="#7a8071" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M194 163H216"/>
      <path d="M422 163H444"/>
    </g>
    <text x="108" y="172" text-anchor="middle" font-size="25">Tweet text</text>
    <text x="320" text-anchor="middle" font-size="23">
      <tspan x="320" y="148">Entropy +</tspan>
      <tspan x="320" y="180">language counts</tspan>
    </text>
    <text x="532" text-anchor="middle" font-size="25" fill="#805842">
      <tspan x="532" y="148">Bayesian</tspan>
      <tspan x="532" y="180">score</tspan>
    </text>
  </g>
</svg>
