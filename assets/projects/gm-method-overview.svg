<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title description">
  <title id="title">Low-rank adaptation and GM workstreams</title>
  <desc id="description">A schematic of the LoRA low-rank weight update, delta W equals B A. Separate labels describe PaliGemma with LoRA for driving actions and a visual chatbot for assembly-line inspection. Matrix proportions are schematic, not specific parameter dimensions.</desc>
  <rect width="640" height="300" fill="#fcfbf8"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#292923">
    <text x="32" y="39" font-size="24">Low-rank adaptation</text>
    <g fill="none" stroke="#292923" stroke-width="1.5">
      <path d="M95 65H222V159H95Z"/>
      <path d="M300 65H330V159H300Z M393 103H528V130H393Z"/>
    </g>
    <g fill="none" stroke="#292923" stroke-opacity=".2" stroke-width="1">
      <path d="M120 65V159M146 65V159M171 65V159M197 65V159M95 89H222M95 112H222M95 136H222"/>
      <path d="M315 65V159M300 89H330M300 112H330M300 136H330M393 116.5H528M420 103V130M447 103V130M474 103V130M501 103V130"/>
    </g>
    <text x="250" y="125" font-size="34">=</text>
    <text x="356" y="125" font-size="30">×</text>
    <g text-anchor="middle" font-size="30" font-style="italic">
      <text x="158" y="195">ΔW</text>
      <text x="315" y="195">B</text>
      <text x="460" y="195">A</text>
    </g>
    <path d="M32 219H608" stroke="#292923" stroke-opacity=".25"/>
    <text x="32" y="248" font-size="21">PaliGemma + LoRA <tspan fill="#716c62">· driving actions</tspan></text>
    <text x="32" y="277" font-size="21">Visual chatbot <tspan fill="#716c62">· assembly-line inspection</tspan></text>
  </g>
</svg>
