<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">Three foundations of trustworthy AI</title>
  <desc id="desc">An editorial illustration of fairness, explainability, and transparency, the three themes of the social impact report on computer vision, robotics, and aviation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7f3"/><stop offset="1" stop-color="#e1e8e5"/></linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#819890" opacity=".28"/></pattern>
  </defs>
  <rect width="600" height="500" rx="10" fill="url(#paper)"/>
  <rect width="600" height="500" rx="10" fill="url(#grid)"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.6" fill="#617b76">
    <text x="36" y="38">AI &amp; SOCIETY</text><text x="564" y="38" text-anchor="end">AA120Q</text>
  </g>
  <text x="36" y="115" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" fill="#2e4b49">Trustworthy AI.</text>
  <text x="38" y="153" font-family="'DM Sans', sans-serif" font-size="17" fill="#607673">What makes automation trustworthy?</text>
  <path d="M38 189H562" stroke="#afc0b9"/>
  <g fill="#f9faf6" stroke="#c0cec7"><rect x="28" y="220" width="169" height="180" rx="12"/><rect x="215" y="220" width="169" height="180" rx="12"/><rect x="402" y="220" width="170" height="180" rx="12"/></g>
  <!-- Equal-weight scales represent fairness. -->
  <g stroke="#567671" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 253v68m-16 8h32m-49-63h66M81 266l-15 30h30zm65 0-15 30h30z"/>
    <path d="M66 296q15 20 30 0m35 0q15 20 30 0" fill="#d7e2dc"/>
  </g>
  <circle cx="113" cy="263" r="5" fill="#b97855"/>
  <!-- A visible decision path represents explainability. -->
  <g fill="none" stroke="#96afa5" stroke-width="2"><path d="M265 267h35v51h37m-37-51h37m-72 51h35"/><path d="M265 267h35v51h37" stroke="#b97855" stroke-width="3"/></g>
  <g fill="#edf2eb" stroke="#567671" stroke-width="2"><circle cx="265" cy="267" r="8"/><circle cx="337" cy="267" r="8"/><circle cx="265" cy="318" r="8"/></g>
  <circle cx="337" cy="318" r="9" fill="#b97855"/><path d="m333 318 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
  <!-- Overlapping visible layers represent transparency. -->
  <g stroke="#567671" stroke-width="2" stroke-linejoin="round"><path d="m446 308 41-23 42 23-42 24z" fill="#bfd1c6" fill-opacity=".45"/><path d="m446 286 41-23 42 23-42 24z" fill="#d6e2d9" fill-opacity=".6"/><path d="m446 264 41-23 42 23-42 24z" fill="#f4f7f0" fill-opacity=".85"/></g>
  <path d="M487 271v52" stroke="#b97855" stroke-width="2" stroke-dasharray="3 5"/>
  <g font-family="'Cormorant Garamond', Georgia, serif" font-size="23" text-anchor="middle" fill="#2e4b49"><text x="113" y="368">Fairness</text><text x="300" y="368">Explainability</text><text x="487" y="368">Transparency</text></g>
  <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".5" text-anchor="middle" fill="#617b76"><text x="113" y="386">WHO IS AFFECTED?</text><text x="300" y="386">WHY THIS DECISION?</text><text x="487" y="386">WHAT CAN WE SEE?</text></g>
  <path d="M38 437H562" stroke="#afc0b9"/>
  <text x="300" y="470" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" fill="#617b76">Computer vision · Robotics · Aviation</text>
</svg>
